<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Автомойка: тайкун</title>
<style>
:root{--bg:#e6f5f9;--ink:#12304a;--card:#fff;--btn:#0a9fb2;--btn-ink:#fff;--coin:#ffd23f;--mute:#5d7a8c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2230;--ink:#e4f2f8;--card:#16354a;--btn:#12a4b8;--mute:#8fb0c2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e2230;--ink:#e4f2f8;--card:#16354a;--btn:#12a4b8;--mute:#8fb0c2;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif;padding:12px;max-width:760px;margin:0 auto}
#hud{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;flex:1;min-width:90px;text-align:center}
.chip small{display:block;font-weight:400;color:var(--mute);font-size:11px}
canvas{width:100%;display:block;border-radius:14px;touch-action:manipulation;background:#bfe6f2}
#mv,#fin,#rst{display:block;width:100%;margin:10px 0;text-align:center;font-size:17px;font-weight:700;background:var(--coin);color:#12304a;animation:pu 1.2s ease-in-out infinite}
#mv[hidden],#fin[hidden],#rst[hidden]{display:none}
#rst{background:var(--card);color:var(--ink);animation:none}
@keyframes pu{50%{transform:scale(1.03)}}
#d{cursor:pointer}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
#dlg[hidden],#dv1[hidden],#dv2[hidden]{display:none}
.box{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;max-width:360px;width:100%;text-align:center}
.box h2{margin:0 0 8px}.box p{margin:0 0 12px}
.box button{display:block;width:100%;margin:6px 0;text-align:center;font-weight:700}
#dr,#dy{background:#c0392b;color:#fff}
#hint{color:var(--mute);font-size:13px;margin:8px 2px}
#ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}
button{font:inherit;background:var(--btn);color:var(--btn-ink);border:0;border-radius:12px;padding:10px;text-align:left;cursor:pointer}
button b{display:block}
button span{color:var(--coin);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
</style>
</head>
<body>
<div id="hud">
  <div class="chip" id="m">$0<small>деньги</small></div>
  <div class="chip" id="r">0%<small>репутация</small></div>
  <div class="chip" id="d">День 1<small id="g">цель: $2500</small></div>
</div>
<canvas id="c" width="640" height="380"></canvas>
<div id="dlg" hidden><div class="box"><h2 id="dt"></h2><p id="dp"></p>
<div id="dv1"><button id="dc">Продолжить</button><button id="dr">Начать заново</button></div>
<div id="dv2" hidden><p>Точно начать заново? Весь прогресс сотрётся.</p><button id="dy">Да</button><button id="dn">Нет</button></div></div></div>
<button id="mv" hidden></button>
<p id="hint">Нажимай на машину в боксе, чтобы мыть быстрее. Клиенты не любят ждать. Золотые и красные VIP-машины платят x3 и дают двойной бонус к репутации.</p>
<div id="ups"></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=640;
const S={money:40,rep:60,t:0,bays:1,spd:0,prc:0,ad:0,earned:0,dist:0,wax:0,cafe:0,vipl:0,ctr:0,ctrT:0,fin:0};
const cars=[],queue=[],bayCar=[null,null,null,null,null,null],parts=[],floats=[];
const cols=['#e4572e','#f2b134','#2e86ab','#7bb661','#a05cc9','#f4f4f4'];
const bx=i=>70+i*100, qx=i=>560-i*95;
const price=()=>10+4*S.prc, rate=()=>0.18*(1+0.3*S.spd);
let spawnT=1;
const clouds=[{x:60,y:28,s:1,v:8},{x:300,y:58,s:.8,v:5},{x:520,y:20,s:1.2,v:11}];

const D=[
 {name:'Окраина',m:1,need:0,btn:'#0a9fb2',sky:['#8fd3ee','#d9f2fa'],cl:'rgba(255,255,255,.65)',road:'#3a4856',lane:'#fff',roof:'#0a9fb2',sign:'#ffd23f',fl:'#d4edf4',fl2:'#a9d6e3',line:'#0a9fb2',lock:'#8c9aa8',bush:['#2f8f4e','#3aa65c','#3aa65c','#58c27a']},
 {name:'Спальный район',m:2,need:5000,btn:'#e8742a',sky:['#ff9f5a','#ffe3c2'],cl:'rgba(255,255,255,.6)',road:'#5b4a44',lane:'#ffd9a8',roof:'#13b5a8',sign:'#fff0d6',fl:'#ffe6cc',fl2:'#ffc58f',line:'#ff8a3d',lock:'#a8928a',bush:['#2c8a6a','#37a37f','#37a37f','#5fc9a2']},
 {name:'Деловой центр',m:4,need:25000,btn:'#3b4fd8',sky:['#0b1535','#26388a'],cl:'rgba(150,175,255,.15)',road:'#151c33',lane:'#39f3ff',roof:'#14225a',sign:'#39f3ff',glow:'#39f3ff',fl:'#1c2a5e',fl2:'#122049',line:'#ff3df2',lock:'#2a3358',bush:['#1a5a52','#217a6e','#217a6e','#2fa393']},
 {name:'Элитный квартал',m:8,need:125000,btn:'#7a5c12',sky:['#14110a','#4a3a14'],cl:'rgba(255,215,120,.12)',road:'#0e0e0e',lane:'#d4a72c',roof:'#1a1a1a',sign:'#ffd24a',glow:'#ffb800',fl:'#26200f',fl2:'#17130a',line:'#d4a72c',lock:'#3a3320',bush:['#1f3b24','#2a4d30','#2a4d30','#3d6b44']}
];
const T=()=>D[S.dist];
const KEY='carwash_v2';let arm=false,lastSave=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify({money:S.money,rep:S.rep,t:S.t,bays:S.bays,spd:S.spd,prc:S.prc,ad:S.ad,wax:S.wax,cafe:S.cafe,vipl:S.vipl,ctr:S.ctr,fin:S.fin,earned:S.earned,dist:S.dist,mult:T().m}));}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o)for(const k of ['money','rep','t','bays','spd','prc','ad','wax','cafe','vipl','ctr','fin','earned','dist'])if(typeof o[k]==='number')S[k]=o[k];}catch(e){}S.dist=Math.min(3,Math.max(0,S.dist|0));S.bays=Math.min(6,Math.max(1,S.bays|0));if(S.dist<1)S.wax=S.cafe=S.vipl=0;if(S.dist<2)S.ctr=0;}
function theme(){document.documentElement.style.setProperty('--btn',T().btn);}
function relocate(){const n=D[S.dist+1];if(!n||S.money<n.need)return;
 S.dist++;Object.assign(S,{money:40,bays:1,spd:0,prc:0,ad:0,wax:0,cafe:0,vipl:0,ctr:0,ctrT:0,earned:0});
 cars.length=0;queue.length=0;bayCar.fill(null);parts.length=0;floats.length=0;spawnT=1;
 theme();save();float(320,160,'🚀 '+T().name+' · x'+T().m);}
function mvUpdate(){const n=D[S.dist+1],b=document.getElementById('mv');
 b.hidden=!(n&&S.money>=n.need);
 if(!b.hidden&&!arm)b.textContent='🚀 Переехать в «'+n.name+'» (доход x'+n.m+')';
 if(Date.now()-lastSave>2000){save();lastSave=Date.now();}}
document.getElementById('mv').onclick=()=>{const b=document.getElementById('mv');
 if(!arm){arm=true;b.textContent='Точно? Деньги, боксы и улучшения сбросятся. Нажми ещё раз';setTimeout(()=>{arm=false;},4000);}
 else{arm=false;relocate();}};
const E=id=>document.getElementById(id);
function openDlg(){E('dt').textContent='День '+(1+Math.floor(S.t/60));
 E('dp').textContent=S.fin?'Твоя империя построена! 🏆':'Район: '+T().name+' · доход x'+T().m+'. Империя ещё строится.';
 E('dv1').hidden=false;E('dv2').hidden=true;E('dlg').hidden=false;}
E('d').onclick=openDlg;
E('dc').onclick=()=>{fin=false;E('dlg').hidden=true;};
E('dr').onclick=()=>{E('dv1').hidden=true;E('dv2').hidden=false;};
E('dn').onclick=()=>{E('dv1').hidden=false;E('dv2').hidden=true;};
E('dy').onclick=()=>{Object.assign(S,{money:40,rep:60,t:0,bays:1,spd:0,prc:0,ad:0,wax:0,cafe:0,vipl:0,ctr:0,ctrT:0,fin:0,earned:0,dist:0});
 cars.length=0;queue.length=0;bayCar.fill(null);parts.length=0;floats.length=0;fw.length=0;spawnT=1;fin=false;theme();save();E('dlg').hidden=true;};
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

const U=[
 {n:'Новый бокс',lv:()=>S.bays+'/6',max:()=>S.bays>=6,cost:()=>Math.round(60*Math.pow(1.7,S.bays-1)),go:()=>S.bays++},
 {n:'Быстрые щётки',lv:()=>'ур. '+S.spd,max:()=>S.spd>=8,cost:()=>Math.round(35*Math.pow(1.55,S.spd)),go:()=>S.spd++},
 {n:'Цены выше',lv:()=>'$'+price()*T().m+' за мойку',max:()=>S.prc>=8,cost:()=>Math.round(45*Math.pow(1.6,S.prc)),go:()=>S.prc++},
 {n:'Реклама',lv:()=>'ур. '+S.ad,max:()=>S.ad>=8,cost:()=>Math.round(30*Math.pow(1.55,S.ad)),go:()=>S.ad++},
 {d:1,n:'Воск и полировка',lv:()=>'+'+15*S.wax+'% к оплате',max:()=>S.wax>=10,cost:()=>Math.round(80*Math.pow(1.6,S.wax)),go:()=>S.wax++},
 {d:1,n:'Кафе для клиентов',lv:()=>'$'+(2.5*S.cafe*T().m).toFixed(1)+' в сек.',max:()=>S.cafe>=10,cost:()=>Math.round(120*Math.pow(1.6,S.cafe)),go:()=>S.cafe++},
 {d:1,n:'VIP-клуб',lv:()=>(12+2*S.vipl)+'% VIP-машин',max:()=>S.vipl>=8,cost:()=>Math.round(100*Math.pow(1.65,S.vipl)),go:()=>S.vipl++},
 {d:2,n:'Корпоративные контракты',lv:()=>'+$'+625*S.ctr+' каждые 10 с',max:()=>S.ctr>=8,cost:()=>Math.round(400*Math.pow(1.7,S.ctr)),go:()=>S.ctr++}
];
function nxt(u){const sn=Object.assign({},S);u.go();const r=u.lv();Object.assign(S,sn);return r;}
const fw=[];let fin=false,fwT=0;
function boom(){const x=80+Math.random()*480,y=60+Math.random()*150,c=['#ffd23f','#ff6f91','#39f3ff','#7bff9a'][Math.random()*4|0];for(let i=0;i<26;i++){const a=i/26*6.28,v=60+Math.random()*50;fw.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:1,c});}}
const CM=()=>S.dist==2?2.4:S.dist>=3?4:1;
U.forEach(u=>{const c=u.cost;u.cost=()=>Math.round(c()*CM());});
const ups=document.getElementById('ups');
U.forEach(u=>{u.el=document.createElement('button');u.el.onclick=()=>{if(!u.max()&&S.money>=u.cost()){S.money-=u.cost();u.go();}};ups.appendChild(u.el);});

function spawn(){const vip=Math.random()<0.12+0.02*S.vipl;cars.push({x:-60,y:320,col:vip?(Math.random()<.5?'#f5c518':'#ff1e3c'):cols[Math.random()*cols.length|0],vip,st:'q',prog:0,pat:30,wp:[],bay:-1});queue.push(cars[cars.length-1]);}
function mv(c,dt){const w=c.wp[0];if(!w)return true;const dx=w[0]-c.x,dy=w[1]-c.y,d=Math.hypot(dx,dy),s=140*dt;
 if(d<=s){c.x=w[0];c.y=w[1];c.wp.shift();}else{c.x+=dx/d*s;c.y+=dy/d*s;}return false;}
function float(x,y,t){floats.push({x,y,t,a:1});}
function burst(x,y,n){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*50,y:y-10+Math.random()*10,vy:-20-Math.random()*40,r:2+Math.random()*4,a:1});}

function bubbles(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=30+Math.random()*60;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-25,r:2+Math.random()*4,a:1,b:1});}}
function bush(x,y,s){[[T().bush[0],0,0,13],[T().bush[1],-11,3,10],[T().bush[2],11,3,10],[T().bush[3],0,-5,7]].forEach(b=>{g.fillStyle=b[0];g.beginPath();g.arc(x+b[1]*s,y+b[2]*s,b[3]*s,0,7);g.fill();});}

function update(dt){
 const cf=2.5*S.cafe*T().m*dt;S.money+=cf;S.earned+=cf;
 if(S.ctr){S.ctrT+=dt;if(S.ctrT>=10){S.ctrT=0;const v=625*S.ctr;S.money+=v;S.earned+=v;float(320,150,'📄 Контракт +$'+v);}}
 S.t+=dt;if(!S.fin&&S.dist==3&&S.money>=250000&&U.every(u=>u.max())){S.fin=1;fin=true;save();openDlg();}
 if(fin){fwT-=dt;if(fwT<=0){boom();fwT=.5;}}
 fw.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=60*dt;f.a-=dt*.7;});for(let i=fw.length-1;i>=0;i--)if(fw[i].a<=0)fw.splice(i,1);
 clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>W+80)c.x=-100;});
 spawnT-=dt;
 if(spawnT<=0){
  if(queue.length<5)spawn();
  spawnT=(5/(1+0.3*S.ad))*(1.5-S.rep/100*0.7)*(0.8+Math.random()*0.4);
 }
 queue.forEach((c,i)=>{c.wp=[[qx(i),320]];mv(c,dt);c.pat-=dt;});
 for(let i=queue.length-1;i>=0;i--){const c=queue[i];
  if(c.pat<=0){queue.splice(i,1);c.st='out';c.wp=[[c.x,320],[700,320]];S.rep=Math.max(0,S.rep-6);float(c.x,c.y-30,'😡');}
 }
 const f=queue[0];
 if(f&&f.x>=qx(0)-2){
  let b=-1;for(let i=0;i<S.bays;i++)if(!bayCar[i]){b=i;break;}
  if(b>=0){queue.shift();bayCar[b]=f;f.st='in';f.bay=b;f.wp=[[f.x,255],[bx(b),255],[bx(b),185]];}
 }
 for(let i=cars.length-1;i>=0;i--){const c=cars[i];
  if(c.st==='in'){if(mv(c,dt))c.st='wash';}
  else if(c.st==='wash'){
   c.prog+=rate()*dt;
   if(Math.random()<dt*14)burst(c.x,c.y,1);
   if(c.prog>=1){c.prog=1;c.st='done';bayCar[c.bay]=null;
    const pay=Math.round(price()*(0.8+S.rep/250))*(c.vip?3:1)*T().m*(1+0.15*S.wax);
    S.money+=pay;S.earned+=pay;S.rep=Math.min(100,S.rep+(c.vip?3:1.5));float(c.x,c.y-30,(c.vip?'⭐ +$':'+$')+pay);burst(c.x,c.y,c.vip?20:10);
    c.wp=[[c.x,255],[700,255]];}
  }
  else if(c.st==='done'||c.st==='out'){if(mv(c,dt))cars.splice(i,1);}
 }
 parts.forEach(p=>{p.x+=(p.vx||0)*dt;p.y+=p.vy*dt;p.a-=dt*(p.b?0.7:0.9);});for(let i=parts.length-1;i>=0;i--)if(parts[i].a<=0)parts.splice(i,1);
 floats.forEach(f=>{f.y-=30*dt;f.a-=dt*0.7;});for(let i=floats.length-1;i>=0;i--)if(floats[i].a<=0)floats.splice(i,1);
}

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function drawCar(c){
 g.save();g.translate(c.x,c.y);
 g.fillStyle=c.col;rr(-28,-12,56,20,6);g.fill();
 if(c.vip){g.beginPath();g.moveTo(-14,-12);g.lineTo(-6,-22);g.lineTo(8,-22);g.lineTo(20,-12);g.closePath();g.fill();
  g.fillStyle='#bfe4f5';g.beginPath();g.moveTo(-8,-12);g.lineTo(-3,-19);g.lineTo(6,-19);g.lineTo(13,-12);g.closePath();g.fill();}
 else{rr(-16,-22,32,14,5);g.fill();g.fillStyle='#bfe4f5';g.fillRect(-12,-19,10,9);g.fillRect(2,-19,10,9);}
 g.globalAlpha=Math.max(0,1-c.prog)*0.7;g.fillStyle='#6b4a2b';rr(-28,-12,56,20,6);g.fill();if(!c.vip){rr(-16,-22,32,14,5);g.fill();}
 g.globalAlpha=1;g.fillStyle='#1d2630';[-16,16].forEach(x=>{g.beginPath();g.arc(x,9,6,0,7);g.fill();});
 if(c.vip){g.font='bold 11px Trebuchet MS,sans-serif';g.textAlign='center';g.lineWidth=3;g.strokeStyle='#12304a';g.fillStyle='#ffd23f';g.strokeText('★ VIP x3',0,-38);g.fillText('★ VIP x3',0,-38);}
 if(c.st==='q'){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-24,-30,48,4);g.fillStyle=c.pat>10?'#4cc38a':'#e4572e';g.fillRect(-24,-30,48*Math.max(0,c.pat/30),4);}
 g.restore();
}

function draw(){
 const sk=g.createLinearGradient(0,0,0,120);sk.addColorStop(0,T().sky[0]);sk.addColorStop(1,T().sky[1]);
 g.fillStyle=sk;g.fillRect(0,0,W,380);
 clouds.forEach(c=>{g.fillStyle=T().cl;[[0,0,26],[24,-6,20],[-24,-4,18],[44,4,14],[-42,5,13]].forEach(b=>{g.beginPath();g.ellipse(c.x+b[0]*c.s,c.y+b[1]*c.s,b[2]*c.s*1.3,b[2]*c.s*.8,0,0,7);g.fill();});});
 g.fillStyle=T().road;g.fillRect(0,235,W,145);
 g.fillStyle=T().lane;for(let x=0;x<W;x+=50)g.fillRect(x,288,26,3);
 g.fillStyle=T().roof;g.fillRect(0,96,W,26);
 g.fillStyle=T().sign;g.shadowColor=T().glow||'transparent';g.shadowBlur=T().glow?10:0;g.font='bold 16px Trebuchet MS,sans-serif';g.textAlign='left';g.fillText('АВТОМОЙКА  ·  '+T().name,14,114);g.shadowBlur=0;
 for(let i=0;i<6;i++){
  const x0=bx(i)-46;
  if(i>=S.bays){
   g.fillStyle=T().lock;g.fillRect(x0,122,92,113);
   g.fillStyle='#fff';g.textAlign='center';g.font='13px Trebuchet MS,sans-serif';
   g.fillText(i===S.bays?'🔒':'🔒',bx(i),170);
   if(i===S.bays)g.fillText('$'+U[0].cost(),bx(i),195);
   continue;
  }
  g.fillStyle=T().fl;g.fillRect(x0,122,92,113);
  g.fillStyle=T().fl2;g.fillRect(x0,222,92,13);
  g.strokeStyle=T().line;g.lineWidth=3;g.strokeRect(x0,122,92,113);
 }
 bush(10,232,1.1);bush(630,232,1.1);bush(28,237,.7);bush(612,237,.7);
 cars.forEach(c=>{if(c.st==='q'||c.st==='out'||c.st==='done'||c.st==='in'||c.st==='wash')drawCar(c);});
 for(let i=0;i<S.bays;i++){const c=bayCar[i];if(!c||c.st!=='wash')continue;
  const w=Math.sin(S.t*12)*6;g.fillStyle='#ff6f91';
  rr(bx(i)-44,140,10,70+w,5);g.fill();rr(bx(i)+34,140,10,70-w,5);g.fill();
  g.fillStyle='rgba(0,0,0,.2)';g.fillRect(bx(i)-30,130,60,6);g.fillStyle='#ffd23f';g.fillRect(bx(i)-30,130,60*c.prog,6);}
 parts.forEach(p=>{g.globalAlpha=Math.max(0,p.a);g.beginPath();g.arc(p.x,p.y,p.r,0,7);if(p.b){g.fillStyle='rgba(255,255,255,.35)';g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();}else{g.fillStyle='#fff';g.fill();}});
 g.globalAlpha=1;g.textAlign='center';g.font='bold 18px Trebuchet MS,sans-serif';
 floats.forEach(f=>{g.globalAlpha=Math.max(0,f.a);g.fillStyle='#ffd23f';g.strokeStyle='#12304a';g.lineWidth=3;g.strokeText(f.t,f.x,f.y);g.fillText(f.t,f.x,f.y);});
 g.globalAlpha=1;
 if(fin){g.fillStyle='rgba(10,10,20,.78)';g.fillRect(0,0,W,380);
  fw.forEach(f=>{g.globalAlpha=Math.max(0,f.a);g.fillStyle=f.c;g.fillRect(f.x,f.y,3,3);});g.globalAlpha=1;
  g.textAlign='center';g.fillStyle='#ffd24a';g.font='bold 30px Trebuchet MS,sans-serif';g.fillText('🏆 ФИНАЛ',320,120);
  g.fillStyle='#fff';g.font='15px Trebuchet MS,sans-serif';
  ['Из гаража на окраине ты дошёл до элитного квартала.','Все улучшения куплены, в кассе $250 000.','Дней в бизнесе: '+(1+Math.floor(S.t/60)),'Твоя мойка стала легендой города!'].forEach((t,i)=>g.fillText(t,320,170+i*30));}
 g.globalAlpha=1;
}

function hud(){
 document.getElementById('m').firstChild.nodeValue='$'+Math.floor(S.money);
 document.getElementById('r').firstChild.nodeValue=Math.round(S.rep)+'%';
 document.getElementById('d').firstChild.nodeValue='День '+(1+Math.floor(S.t/60))+' · x'+T().m;
 document.getElementById('g').textContent=D[S.dist+1]?'переезд: $'+Math.floor(S.money)+' / '+D[S.dist+1].need:(S.fin?'империя построена 🏆':'финал: $'+Math.floor(S.money)+' / 250000 · улучшения '+U.filter(u=>u.max()).length+'/'+U.length);
 U.forEach(u=>{const m=u.max();u.el.innerHTML='<b>'+u.n+'</b>'+u.lv()+(m?'':' → '+nxt(u))+' · <span>'+(m?'макс':'$'+u.cost())+'</span>';u.el.disabled=m||S.money<u.cost();u.el.hidden=S.dist<(u.d||0);});

 mvUpdate();
}

cv.addEventListener('pointerdown',e=>{
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*380/r.height;
 for(let i=0;i<S.bays;i++){const c=bayCar[i];
  if(c&&c.st==='wash'&&Math.abs(x-bx(i))<48&&y>120&&y<240){c.prog=Math.min(1,c.prog+0.05);bubbles(x,y,10);if(navigator.vibrate)navigator.vibrate(20);}}
});

let last=performance.now(),acc=0;
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;update(dt);draw();acc+=dt;if(acc>0.15){acc=0;hud();}requestAnimationFrame(loop);}
load();theme();hud();requestAnimationFrame(loop);
</script>
