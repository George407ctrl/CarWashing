name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KS_PASS }}
      SITE_URL: https://george407ctrl.github.io/CarWashing/
      APP_ID: com.george.carwash3d
      APP_NAME: Автомойка 3D
    steps:
      - uses: actions/checkout@v4

      - name: Check password secret
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "Не задан секрет KS_PASS (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          mkdir -p twa/app/src/main/res/mipmap-xxxhdpi twa/app/src/main/res/values
          cp icon-192.png twa/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > twa/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'CarWash'
          include ':app'
          EOF

          cat > twa/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > twa/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > twa/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.george.carwash3d'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.george.carwash3d'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }
              signingConfigs {
                  release {
                      storeFile file('../release.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'carwash'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          cat > twa/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="$SITE_URL" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/colorPrimary" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > twa/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#0a9fb2</color>
          </resources>
          EOF

          cat > twa/app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore twa/release.keystore -alias carwash \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=CarWash, O=Carwash3D, C=RU"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: gradle -p twa assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carwash-apk
          path: twa/app/build/outputs/apk/release/app-release.apk

      - name: Upload keystore (protected by KS_PASS)
        uses: actions/upload-artifact@v4
        with:
          name: carwash-keystore
          path: twa/release.keystore
